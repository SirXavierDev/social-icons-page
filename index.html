<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="social-wrapper">
        <a href="https://www.facebook.com/" target="_blank" rel="noopener noreferrer" class="social-icon facebook" aria-label="Facebook">
            <i class="fa-brands fa-facebook-f" aria-hidden="true"></i>
        </a>
        <a href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer" class="social-icon instagram" aria-label="Instagram">
            <i class="fa-brands fa-instagram" aria-hidden="true"></i>
        </a>
        <a href="https://x.com/" target="_blank" rel="noopener noreferrer" class="social-icon x-twitter" aria-label="X">
            <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
        </a>
        <a href="https://github.com/" target="_blank" rel="noopener noreferrer" class="social-icon github" aria-label="GitHub">
            <i class="fa-brands fa-github" aria-hidden="true"></i>
        </a>
    </div>
</body>
</html>
